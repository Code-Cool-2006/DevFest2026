<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEVFEST BELGAUM 2026 - GOOGLE DEVELOPER GROUP BELGAUM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/plugins/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/plugins/themefisher-font/style.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* ===== DevFest Shutter Split Loader (GPU-Composited) ===== */
      #loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        contain: strict;
        pointer-events: auto;
      }
      #loader-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, #ffffff 0%, #f4f7fb 100%);
        opacity: 1;
        will-change: opacity;
        transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #loader-overlay.is-revealing {
        pointer-events: none;
      }
      #loader-overlay.is-revealing::before {
        opacity: 0;
      }
      #loader-overlay.is-hidden {
        display: none;
      }
      #sunburst-svg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate3d(-50%, -50%, 0);
        width: 142vmax;
        height: 142vmax;
        max-width: none;
        backface-visibility: hidden;
        will-change: transform, opacity;
      }
      .wedge-path  { transform-origin: 500px 500px; }
      .divider-line { transform-origin: 500px 500px; }
      #center-badge {
        position: relative;
        z-index: 10;
        width: clamp(185px, 28vw, 240px);
        height: clamp(185px, 28vw, 240px);
        border-radius: 9999px;
        background: #ffffff;
        border: 3.5px solid #202124;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.18), 0 0 0 6px rgba(255, 255, 255, 0.45);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1.25rem;
        backface-visibility: hidden;
        will-change: transform, opacity;
      }
      #badge-ring {
        position: absolute;
        inset: 8px;
        width: calc(100% - 16px);
        height: calc(100% - 16px);
        transform: rotate(-90deg);
        pointer-events: none;
      }
      #progress-arc {
        transition: stroke 0.25s ease;
      }
      .loader-google-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(1.125rem, 2.2vw, 1.25rem);
        letter-spacing: -0.025em;
        margin-bottom: 2px;
        user-select: none;
      }
      .loader-devfest-title {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(1.5rem, 3vw, 1.875rem);
        color: #202124;
        letter-spacing: -0.025em;
        line-height: 1;
        user-select: none;
      }
      .loader-status-pill {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 11px;
        border-radius: 9999px;
        background-color: #f3f4f6;
        border: 1px solid rgba(209, 213, 219, 0.85);
      }
      #loader-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background-color: #4285F4;
        will-change: transform, opacity;
        animation: loader-ping 1.1s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      #loader-status-dot.done {
        animation: none;
        background-color: #34A853;
      }
      #loader-progress-text {
        font-size: 0.75rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #374151;
      }
      @keyframes loader-ping {
        0% { transform: scale3d(0.95, 0.95, 1); opacity: 1; }
        75%, 100% { transform: scale3d(1.9, 1.9, 1); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loader-status-dot { animation: none; }
      }
    </style>
  </head>
  <body id="body">

    <!-- ===== DevFest Shutter Split Loader ===== -->
    <div id="loader-overlay" aria-live="polite" aria-label="Loading Google DevFest">
      <svg id="sunburst-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
        <g id="wedges-group"></g>
        <g id="dividers-group"></g>
      </svg>
      <div id="center-badge">
        <svg id="badge-ring" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="46" fill="none" stroke="#F1F3F4" stroke-width="3" />
          <circle id="progress-arc" cx="50" cy="50" r="46" fill="none" stroke="#4285F4" stroke-width="3.5"
                  stroke-linecap="round" stroke-dasharray="289.02" stroke-dashoffset="289.02" />
        </svg>
        <div class="loader-google-brand">
          <span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC04">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span>
        </div>
        <div class="loader-devfest-title">DevFest</div>
        <div class="loader-status-pill">
          <span id="loader-status-dot"></span>
          <span id="loader-progress-text">0%</span>
        </div>
      </div>
    </div>
    <!-- ===== End Loader ===== -->

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        const WEDGE_CONFIG = [
          { color: '#4285F4', start: -112, end: -72 },
          { color: '#EA4335', start: -72,  end: -34 },
          { color: '#34A853', start: -34,  end:  2  },
          { color: '#FBBC04', start:  2,   end:  36 },
          { color: '#4285F4', start:  36,  end:  74 },
          { color: '#34A853', start:  74,  end: 108 },
          { color: '#4285F4', start: 108,  end: 146 },
          { color: '#EA4335', start: 146,  end: 182 },
          { color: '#34A853', start: 182,  end: 216 },
          { color: '#FBBC04', start: 216,  end: 248 },
        ];

        const overlay       = document.getElementById('loader-overlay');
        const sunburstSvg   = document.getElementById('sunburst-svg');
        const wedgesGroup   = document.getElementById('wedges-group');
        const dividersGroup = document.getElementById('dividers-group');
        const centerBadge   = document.getElementById('center-badge');
        const progressArc   = document.getElementById('progress-arc');
        const progressText  = document.getElementById('loader-progress-text');
        const statusDot     = document.getElementById('loader-status-dot');

        const wedgeElements   = [];
        const dividerElements = [];

        function polar(cx, cy, r, deg) {
          const rad = (deg * Math.PI) / 180;
          return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
        }

        function buildSunburst() {
          const cx = 500, cy = 500, outerR = 760, innerR = 55;
          WEDGE_CONFIG.forEach((w, idx) => {
            const sA = w.start - 0.3, eA = w.end + 0.3;
            const p1 = polar(cx, cy, innerR, sA);
            const p2 = polar(cx, cy, outerR, sA);
            const p3 = polar(cx, cy, outerR, eA);
            const p4 = polar(cx, cy, innerR, eA);
            const la = (eA - sA) > 180 ? 1 : 0;
            const d = [
              `M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`,
              `L ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`,
              `A ${outerR} ${outerR} 0 ${la} 1 ${p3.x.toFixed(2)} ${p3.y.toFixed(2)}`,
              `L ${p4.x.toFixed(2)} ${p4.y.toFixed(2)}`,
              `A ${innerR} ${innerR} 0 ${la} 0 ${p1.x.toFixed(2)} ${p1.y.toFixed(2)}`, 'Z'
            ].join(' ');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            path.setAttribute('fill', w.color);
            path.classList.add('wedge-path');
            path.dataset.midAngle = ((w.start + w.end) / 2).toString();
            wedgesGroup.appendChild(path);
            wedgeElements.push(path);

            const ls = polar(cx, cy, innerR, w.start);
            const le = polar(cx, cy, outerR, w.start);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', ls.x.toFixed(2)); line.setAttribute('y1', ls.y.toFixed(2));
            line.setAttribute('x2', le.x.toFixed(2)); line.setAttribute('y2', le.y.toFixed(2));
            line.setAttribute('stroke', '#202124'); line.setAttribute('stroke-width', '3.5');
            line.setAttribute('stroke-linecap', 'round');
            line.classList.add('divider-line');
            dividersGroup.appendChild(line);
            dividerElements.push(line);
          });
        }

        const easeOutBack     = t => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); };
        const easeOutCubic    = t => 1 - Math.pow(1-t,3);
        const easeInOutCubic  = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
        const easeInExpo      = t => t===0 ? 0 : Math.pow(2,10*t-10);

        function updateProgress(pct) {
          const c = Math.min(100, Math.max(0, Math.round(pct)));
          progressArc.style.strokeDashoffset = (289.02 - (c/100)*289.02).toFixed(2);
          progressText.textContent = `${c}%`;
          progressArc.style.stroke = c<25?'#4285F4':c<50?'#EA4335':c<75?'#FBBC04':'#34A853';
        }

        function play() {
          overlay.classList.remove('is-hidden','is-revealing');
          statusDot.classList.remove('done');
          updateProgress(0);
          sunburstSvg.style.opacity = '1';
          sunburstSvg.style.transform = 'translate3d(-50%,-50%,0) scale3d(1,1,1) rotate(0deg)';
          centerBadge.style.opacity = '1';
          centerBadge.style.transform = 'scale3d(0,0,1)';
          wedgeElements.forEach(w => { w.style.opacity='1'; w.style.transform=''; });
          dividerElements.forEach(d => { d.style.opacity='1'; d.style.transform=''; });

          const introD=580, loadD=1150, revealD=720, totalD=introD+loadD+revealD;
          let prevNow = performance.now(), e = 0, settledWedges = false;

          function tick(now) {
            e += Math.min(42, Math.max(0, now - prevNow));
            prevNow = now;
            if (e < introD) {
              const t=e/introD, sp=easeOutBack(t), sm=easeOutCubic(t);
              centerBadge.style.transform = `scale3d(${sp.toFixed(4)},${sp.toFixed(4)},1)`;
              updateProgress(sm*22);
              sunburstSvg.style.transform = `translate3d(-50%,-50%,0) rotate(${(-22*(1-sm)).toFixed(2)}deg)`;
              wedgeElements.forEach((w,i) => {
                const s=Math.max(0,Math.min(1,(t*1.45)-i*0.045)), we=easeOutBack(s);
                w.style.transform=`scale(${we.toFixed(4)}) rotate(${((1-we)*-30).toFixed(2)}deg)`;
              });
              dividerElements.forEach((d,i) => {
                d.style.opacity=Math.max(0,Math.min(1,(t*1.45)-i*0.045)).toFixed(3);
              });
            } else if (e < introD+loadD) {
              if (!settledWedges) {
                settledWedges = true;
                wedgeElements.forEach(w => { w.style.transform=''; });
                dividerElements.forEach(d => { d.style.opacity='1'; });
              }
              const t=(e-introD)/loadD, pulse=(1+Math.sin(t*Math.PI*3)*0.022).toFixed(4);
              updateProgress(22+easeInOutCubic(t)*78);
              centerBadge.style.transform=`scale3d(${pulse},${pulse},1)`;
              sunburstSvg.style.transform=`translate3d(-50%,-50%,0) rotate(${(t*22).toFixed(2)}deg)`;
            } else if (e < totalD) {
              const t=(e-introD-loadD)/revealD, ex=easeInExpo(t), sm=easeOutCubic(t), bsc=(1-sm*0.36).toFixed(3);
              updateProgress(100);
              statusDot.classList.add('done');
              overlay.classList.add('is-revealing');
              centerBadge.style.transform=`scale3d(${bsc},${bsc},1)`;
              centerBadge.style.opacity=Math.max(0,1-sm*1.4).toFixed(3);
              sunburstSvg.style.transform=`translate3d(-50%,-50%,0) rotate(${(22+sm*38).toFixed(2)}deg)`;
              wedgeElements.forEach(w => {
                const mid=parseFloat(w.dataset.midAngle), rad=(mid*Math.PI)/180, dist=ex*950, sc=(1+ex*0.28).toFixed(3);
                w.style.transform=`translate(${(Math.cos(rad)*dist).toFixed(1)}px,${(Math.sin(rad)*dist).toFixed(1)}px) scale(${sc})`;
                w.style.opacity=Math.max(0,1-Math.pow(t,2.2)).toFixed(3);
              });
              dividerElements.forEach(d => { d.style.opacity=Math.max(0,1-sm*2).toFixed(3); });
            } else {
              overlay.classList.add('is-hidden');
              return;
            }
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }

        buildSunburst();
        play();
      })();
    </script>
  </body>
</html>
